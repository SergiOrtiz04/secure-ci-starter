# ---------------------------------------------------------------------------
# CI: lint, typecheck, test, build.
#
# Kept separate from security.yml so a flaky test doesn't hide a security
# failure (and vice versa) in the PR checks list.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor in package.json `engines`; 22 is the current LTS.
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (lockfile only)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          CI: 'true'

      - name: Build
        run: npm run build

      # Boot the compiled server and hit /health so "it compiles" also means
      # "it starts". Cheap smoke test that catches broken imports at runtime.
      - name: Smoke test built server
        run: |
          PORT=3999 node dist/index.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3999/health; then
              echo; echo "server is up"; break
            fi
            sleep 0.5
          done
          curl -fsS http://localhost:3999/health | grep -q '"status":"ok"'
          kill "$SERVER_PID"
